name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ambiente:
    name: ambiente
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Criar .env a partir do exemplo
        run: cp .env.example .env

      - name: Subir PostgreSQL
        run: make up

      - name: Verificar conexão com o banco
        run: make db-check

      - name: Mostrar logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Derrubar ambiente
        if: always()
        run: make down